[package]
name = "pact-escrow"
version = "0.1.0"
description = "Pact Escrow - Accountability Challenge Protocol"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "pact_escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]


[dependencies]
anchor-lang = "0.31.1"
anchor-spl = "0.31.1"
constant_time_eq = "=0.3.1"

